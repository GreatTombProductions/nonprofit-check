<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonprofit Check — IRS Tax-Exempt Organization Search</title>
<meta name="description" content="Search 2.9M US nonprofit organizations. Check tax-deductible status, IRS filing compliance, and revoked exemptions. Data from IRS Publication 78, Auto-Revocation List, and Form 990-N.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Nonprofit Check</h1>
    <p class="subtitle">Search IRS records — deductibility, filings, revocations</p>
</header>

<nav class="tabs">
    <button class="tab active" data-tab="name">By Name</button>
    <button class="tab" data-tab="ein">EIN Lookup</button>
</nav>

<main>
    <!-- Name Search -->
    <section id="name-search" class="search-panel active">
        <input type="text" id="search-input" placeholder="Enter an organization name..." autocomplete="off">
        <div id="search-results" class="results-list"></div>
    </section>

    <!-- EIN Lookup -->
    <section id="ein-search" class="search-panel">
        <p class="panel-desc">Look up an organization by its Employer Identification Number (EIN).</p>
        <div class="ein-box">
            <input type="text" id="ein-input" placeholder="XX-XXXXXXX or XXXXXXXXX" autocomplete="off">
            <button id="ein-btn">Lookup</button>
        </div>
        <div id="ein-result"></div>
    </section>

    <!-- Detail View -->
    <section id="detail-view" class="detail-panel hidden">
        <button class="back-btn">← Back to results</button>
        <div id="detail-content"></div>
    </section>
</main>

<footer>
    <p>Data: IRS <a href="https://www.irs.gov/charities-non-profits/tax-exempt-organization-search-bulk-data-downloads" target="_blank" rel="noopener">TEOS bulk downloads</a>. Updated monthly. <span id="data-date"></span></p>
    <p>2,991,286 tax-exempt organizations · <a href="https://github.com/GreatTombProductions/nonprofit-check" target="_blank" rel="noopener">Source</a> · No tracking · No ads</p>
</footer>

<script src="app.js"></script>
</body>
</html>
